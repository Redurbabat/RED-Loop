name = "red-loop"
main = "cloudflare/src/worker.js"
compatibility_date = "2026-11-06"
workers_dev = true

# Deploy with: npx wrangler deploy
# Requires a Cloudflare account and Wrangler authentication.

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "JOBS"
class_name = "RedLoopJobs"

[[migrations]]
tag = "v1-cloud-jobs"
new_sqlite_classes = ["RedLoopJobs"]

[ai]
binding = "AI"
