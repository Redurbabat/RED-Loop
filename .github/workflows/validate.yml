name: RED Loop validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check && npm test && npm run dry-run
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: |
            test-results/
            docs/previews/
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ios-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-and-unsigned-archive
          path: |
            build/*.log
            build/*.xcresult
            build/*.xcarchive
            build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
            build/ios/unsigned/*.ipa
