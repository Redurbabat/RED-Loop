name: RED Loop Android APK

on:
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'scripts/android-ci.sh'
      - 'scripts/android-sign-release.sh'
      - 'scripts/android-update-test.sh'
      - 'scripts/android-setup-signing.sh'
      - 'scripts/build.mjs'
      - 'userscripts/red-loop.user.js'
      - 'package.json'
      - 'package-lock.json'
      - 'ios/REDLoop/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - 'docs/android.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'scripts/android-ci.sh'
      - 'scripts/android-sign-release.sh'
      - 'scripts/android-update-test.sh'
      - 'scripts/android-setup-signing.sh'
      - 'scripts/build.mjs'
      - 'userscripts/red-loop.user.js'
      - 'package.json'
      - 'package-lock.json'
      - 'ios/REDLoop/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android JVM tests and downloadable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use GitHub runner Android SDK and install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK" && test -d "$SDK" || { echo "Android SDK not present on runner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print | head -n1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install JavaScript build dependencies
        run: npm ci
      - name: Build synchronized Android assets
        run: npm run build
      - name: Android unit tests and debug APK
        run: bash scripts/android-ci.sh
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RED-Loop-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify Android update compatibility with disposable test key
        run: bash scripts/android-update-test.sh

      # Never expose the permanent signing key to PR builds. A signed release
      # is produced only from the reviewed main branch, never from untrusted PRs.
      - name: Build permanently signed Android update
        id: signed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          RED_LOOP_ANDROID_KEYSTORE_B64: ${{ secrets.RED_LOOP_ANDROID_KEYSTORE_B64 }}
          RED_LOOP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RED_LOOP_ANDROID_KEYSTORE_PASSWORD }}
          RED_LOOP_ANDROID_CERT_SHA256: ${{ secrets.RED_LOOP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$RED_LOOP_ANDROID_KEYSTORE_B64" && -z "$RED_LOOP_ANDROID_KEYSTORE_PASSWORD" && -z "$RED_LOOP_ANDROID_CERT_SHA256" ]]; then
            echo "No permanent Android signing key configured. Debug APK is for testing only." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/android-sign-release.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload update-compatible signed Android APK
        if: steps.signed.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RED-Loop-Android-signed-update
          path: android/app/build/outputs/apk/release/RED-Loop-signed.apk
          if-no-files-found: error
          retention-days: 90
