# RED Loop iOS pipeline preparation.
# A native Xcode project is NOT currently present in this repository.
# This workflow deliberately fails clearly rather than claiming to build an IPA.
workflows:
  ios-preview:
    name: RED Loop iOS - prerequisites and build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'feature/ios-*'
          include: true
          source: true
    scripts:
      - name: Verify native iOS project exists
        script: |
          set -eu
          PROJECT="$(find . -type d -name '*.xcodeproj' -not -path './vendor/*' -print -quit)"
          WORKSPACE="$(find . -type d -name '*.xcworkspace' -not -path './vendor/*' -print -quit)"
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo "ERROR: No native iOS Xcode project/workspace exists in RED Loop."
            echo "Create and commit the iOS app and Safari Web Extension before enabling IPA builds."
            exit 1
          fi
          echo "Native Xcode project/workspace detected."
      - name: Verify project builds for iOS simulator
        script: |
          set -eu
          PROJECT="$(find . -type d -name '*.xcodeproj' -not -path './vendor/*' -print -quit)"
          WORKSPACE="$(find . -type d -name '*.xcworkspace' -not -path './vendor/*' -print -quit)"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -list -workspace "$WORKSPACE"
          else
            xcodebuild -list -project "$PROJECT"
          fi
          echo "Project detected. Configure a concrete scheme, signing, and xcodebuild archive before producing an IPA."
