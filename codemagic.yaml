workflows:
  ios-preview:
    name: RED Loop - simulator tests and unsigned archive
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'codex/*'
          include: true
          source: true
    scripts:
      - name: Build, test and archive the native app and Safari extension
        script: bash scripts/ios-ci.sh
    artifacts:
      - build/*.log
      - build/*.xcresult
      - build/*.xcarchive
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/ios/unsigned/*.ipa
  ios-signed:
    name: RED Loop - signed iPhone IPA (manual, signing required)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - red_loop_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bbtred.redloop
    scripts:
      - name: Verify simulator path first
        script: bash scripts/ios-ci.sh
      - name: Apply securely imported profiles, archive and export IPA
        script: bash scripts/ios-sign.sh
    artifacts:
      - build/*.log
      - build/*.xcresult
      - build/*.xcarchive
      - build/ios/ipa/*.ipa
      - build/REDLoop.xcarchive/dSYMs/*.dSYM
