workflows:
  ios-preview:
    name: RED Loop - IPA ohne Apple-Profile (UNSIGNIERT)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'codex/*'
          include: true
          source: true
        - pattern: 'claude/*'
          include: true
          source: true
    scripts:
      - name: Build, test and archive the native app and Safari extension
        script: bash scripts/ios-ci.sh
    artifacts:
      - build/*.log
      - build/*.xcresult
      - build/*.xcarchive
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/ios/unsigned/*.ipa
  android-preview:
    name: RED Loop - Android APK (Debug, direkt installierbar)
    # The same machine the iOS workflows use; Linux instances need a paid plan.
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'codex/*'
          include: true
          source: true
        - pattern: 'claude/*'
          include: true
          source: true
    scripts:
      - name: Run JVM unit tests and build the debug APK
        script: bash scripts/android-ci.sh
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/reports/tests/**
  ios-signed:
    name: RED Loop - TestFlight/App Store (Apple-Profile erforderlich)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - red_loop_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bbtred.redloop
    scripts:
      - name: Verify simulator path first
        script: bash scripts/ios-ci.sh
      - name: Apply securely imported profiles, archive and export IPA
        script: bash scripts/ios-sign.sh
    artifacts:
      - build/*.log
      - build/*.xcresult
      - build/*.xcarchive
      - build/ios/ipa/*.ipa
      - build/REDLoop.xcarchive/dSYMs/*.dSYM
